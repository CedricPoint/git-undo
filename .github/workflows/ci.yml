name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: git --version
      - run: npm test

  dogfood:
    name: run it on this repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: node bin/git-undo.js list
      - name: a dry run must change nothing
        run: |
          before=$(git rev-parse HEAD)
          node bin/git-undo.js || true
          test "$before" = "$(git rev-parse HEAD)"
